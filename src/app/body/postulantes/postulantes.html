<section>
    <div class="container">
        <div class="header">
            <p>POSTULANTES</p>
            <button (click)="abrirAddPostulante()">
                <span class="material-icons">add</span>
            </button>
        </div>
        <div class="choose-evaluation">
            <label for="evaluation">EVALUACIÓ:</label>
            <select name="evaluation" id="evaluation" (change)="filtrarPorEvaluacion($event)">
                <option value="">-- Selecciona una evaluación --</option>
                <option *ngFor="let eval of evaluaciones" [value]="eval">{{ eval }}</option>
            </select>
        </div>
        <div class="buscador">
            <input type="text" placeholder="Ingrese Busqueda" (input)="filtrarPorBusqueda($event)">
        </div>
        <div class="table">     
            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
                
                <ng-container matColumnDef="dni">
                    <th mat-header-cell *matHeaderCellDef> DNI </th>
                    <td mat-cell *matCellDef="let element"> {{element.dni}} </td>
                </ng-container>

                <ng-container matColumnDef="nombres">
                    <th mat-header-cell *matHeaderCellDef> Nombres </th>
                    <td mat-cell *matCellDef="let element"> {{element.nombres}} </td>
                </ng-container>

                <ng-container matColumnDef="apellidos">
                    <th mat-header-cell *matHeaderCellDef> Apellidos </th>
                    <td mat-cell *matCellDef="let element"> {{element.apellidos}} </td>
                </ng-container>

                <ng-container matColumnDef="area">
                    <th mat-header-cell *matHeaderCellDef> Área </th>
                    <td mat-cell *matCellDef="let element"> {{element.area}} </td>
                </ng-container>
                
                <ng-container matColumnDef="carrera">
                    <th mat-header-cell *matHeaderCellDef> Carrera Profecional </th>
                    <td mat-cell *matCellDef="let element"> {{element.carrera}} </td>
                </ng-container>

                <ng-container matColumnDef="accion">
                    <th mat-header-cell *matHeaderCellDef>Acción</th>
                    <td mat-cell *matCellDef="let element">
                        <button class="btn ficha">
                            <span class="material-icons">assignment</span>
                        </button>
                        <button class="btn edit" (click)="abrirEditPostulante(element)">
                            <span class="material-icons">edit</span>
                        </button>
                        <button class="btn delete" (click)="abrirDeletePostulante(element)">
                            <span class="material-icons">delete</span>
                        </button>
                    </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
    </div>
</section>

<app-addpostulante *ngIf="mostrarAddPostulante" (cerrarEvent)="cerrarAddPostulante()"></app-addpostulante>
<app-editpostulante *ngIf="mostrarEditPostulante" [postulante]="postulanteSeleccionado" (cerrarEvent)="cerrarEditPostulante()"></app-editpostulante>
<app-deletepostulante *ngIf="mostrarDeletePostulante" [postulante]="postulanteSeleccionado" (cerrarEvent)="cerrarDeletePostulante()"></app-deletepostulante>
