<section (click)="cerrar()">
    <div class="modal">
        <div class="container"(click)="$event.stopPropagation()">
            <div class="header">
                <p>ELIMINAR POSTULANTE</p>
                <span class="material-icons" (click)="cerrar()">cancel</span>
            </div>
            <div class="confirm">
                <p>¿ELIMINAR POSTULANTE {{postulante?.dni}}?</p>
                <p> {{postulante?.nombres}} {{postulante?.apellidos}} </p>
                <div class="btns">
                    <button class="delete">
                        ELIMINAR
                    </button>
                    <button class="cancel" (click)="cerrar()">
                        CANCEL
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
